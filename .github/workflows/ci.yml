name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PNPM_VERSION: 12.18.0
  NODE_VERSION: 24

jobs:
  rust:
    name: Rust · fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: One version in every manifest
        # The release workflow publishes this version; `Cargo.lock` and the
        # health sample, which state it too, are held by the steps below.
        run: ./scripts/version.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Contract samples are up to date
        # The TypeScript contracts are validated against these files, so they
        # must be exactly what the server emits.
        run: |
          cargo run --locked -p aegis-server --bin export-contract-samples
          git diff --exit-code -- packages/contracts/samples

  web:
    name: Web · typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and component tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  e2e:
    name: End-to-end · Playwright
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the server
        run: cargo build --release --locked -p aegis-server
      - name: Install the test browser
        run: pnpm --filter @aegis/web exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        # Software WebGL 2 plus a run with every GPU API disabled (fallback).
        run: pnpm e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  static:
    name: Static site · engine in WebAssembly
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clippy for the browser target
        # The code that only exists on wasm32 is not seen by the other job.
        run: cargo clippy -p aegis-wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the engine module
        run: pnpm engine:build
      - name: The module answers as the server does
        # Drives the module through the sequence that produced the contract
        # samples and compares the output with them.
        run: pnpm test:engine
      - name: Install the test browser
        run: pnpm --filter @aegis/web exec playwright install --with-deps chromium
      - name: Build the site and run it with no server
        run: pnpm e2e:static
      - uses: actions/upload-artifact@v5
        with:
          name: static-site
          path: apps/web/dist-static
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-static
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    name: Docker · build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test through the web container
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<title>AEGIS'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
            -d '{"scenarioId":"ddos-surge"}' http://127.0.0.1:8080/api/v1/demo/scenarios/start | grep -q '"playback"'
      - name: An import larger than the proxy's ordinary limit goes through
        run: |
          # The files in use, saved as one bundle and imported again: a few
          # hundred kilobytes, where every other route is held to 32.
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/workspace/export \
            | python3 -c 'import json, sys; print(json.dumps({"files": [{"path": "aegis-workspace.json", "text": sys.stdin.read()}]}))' \
            > import.json
          test "$(stat -c %s import.json)" -gt 100000
          curl --fail --silent --show-error -X POST -H 'content-type: application/json' \
            --data-binary @import.json http://127.0.0.1:8080/api/v1/demo/workspace/import | grep -q '"origin":"imported"'
          # The larger limit belongs to the routes that carry files only.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'content-type: application/json' --data-binary @import.json \
            http://127.0.0.1:8080/api/v1/demo/scenarios/start)" = 413
      - name: Logs
        if: ${{ failure() }}
        run: docker compose logs --no-color
      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down --volumes
