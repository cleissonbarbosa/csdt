[package]
name = "aegis-server"
description = "AEGIS backend: deterministic infrastructure simulation, Cedar authorization and telemetry streaming"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
default-run = "aegis-server"

[lib]
name = "aegis_server"
path = "src/lib.rs"

[[bin]]
name = "aegis-server"
path = "src/main.rs"

[[bin]]
name = "export-contract-samples"
path = "src/bin/export_contract_samples.rs"

[[bin]]
name = "export-workspace-schemas"
path = "src/bin/export_workspace_schemas.rs"

[dependencies]
async-trait = "0.1"
cedar-policy = "4.14"
# Pin the generator so published schema changes are deliberate.
schemars = "=1.2.0"
serde = { version = "1", features = ["derive"] }
# Exact float parsing: a topology written out and read back is the same bits,
# which the determinism of a recording depends on.
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# A Compose file is read into a topology (`workspace/compose.rs`): nothing
# else in the server is YAML. Without the legacy encodings it has no unsafe
# dependency.
yaml-rust2 = { version = "0.13", default-features = false }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"

# The library also builds for the browser (`apps/wasm`): there it keeps the
# router, the service and Cedar, and leaves out everything that needs a
# socket, a thread or the operating system's clock.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
tower-http = { version = "0.7", features = ["cors", "trace", "set-header", "limit", "timeout"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["process"] }
tokio-tungstenite = "0.30"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
